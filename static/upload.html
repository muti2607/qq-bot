<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>上传图片 · QQ 机器人</title>
<style>
  :root{
    --bg1:#ffe3f1; --bg2:#e9e4ff; --bg3:#dbeafe;
    --glow1:#ffd6ea; --glow2:#dcd6ff; --glow3:#cfe6ff;
    --card:rgba(255,255,255,.85); --txt:#3f3350; --sub:#9b8fae;
    --line:#f3d3e3; --pink:#ec4899; --pink2:#f472b6; --violet:#8b5cf6;
    --grad:linear-gradient(92deg,#ec4899,#a855f7);
    --ok:#10b981; --err:#ef4444;
    --input-bg:rgba(255,255,255,.9);
  }
  [data-theme="midnight"]{
    --bg1:#131a2b; --bg2:#181430; --bg3:#0f1a24;
    --glow1:#233a63; --glow2:#34265e; --glow3:#16304a;
    --card:rgba(30,38,58,.85); --txt:#e6e9f5; --sub:#8b93ad;
    --line:#39415c; --pink:#818cf8; --pink2:#a78bfa;
    --grad:linear-gradient(92deg,#818cf8,#c084fc);
    --input-bg:rgba(24,31,48,.85);
  }
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;color:var(--txt);
       font:15px/1.7 -apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
       background:
         radial-gradient(900px 500px at 10% -10%, var(--glow1) 0%, transparent 55%),
         radial-gradient(800px 400px at 90% 0%, var(--glow2) 0%, transparent 50%),
         radial-gradient(700px 500px at 50% 110%, var(--glow3) 0%, transparent 55%),
         linear-gradient(160deg, var(--bg1), var(--bg2) 55%, var(--bg3));
       background-attachment:fixed;transition:background .35s ease}
  .card{background:var(--card);backdrop-filter:blur(12px);
        border:1px solid rgba(255,255,255,.5);border-radius:24px;padding:34px 28px;width:min(430px,94vw);
        box-shadow:0 18px 50px rgba(236,72,153,.18);text-align:center}
  h1{font-size:19px;margin:0 0 6px;font-weight:800;
     background:var(--grad);-webkit-background-clip:text;background-clip:text;
     -webkit-text-fill-color:transparent}
  .sub{color:var(--sub);font-size:13px;margin:0 0 22px}
  .drop{
    border:2px dashed var(--line);border-radius:18px;padding:34px 16px;cursor:pointer;
    transition:.2s;background:rgba(255,255,255,.35);margin-bottom:16px;
  }
  .drop:hover,.drop.over{border-color:var(--pink2);background:rgba(255,255,255,.6)}
  .drop .ico{font-size:34px;line-height:1}
  .drop .t1{font-weight:700;margin-top:8px}
  .drop .t2{font-size:12px;color:var(--sub);margin-top:3px}
  input[type=file]{display:none}
  .row{display:flex;gap:10px;margin-bottom:14px}
  input[type=password]{flex:1;background:var(--input-bg);color:var(--txt);
    border:1px solid var(--line);border-radius:12px;padding:11px 14px;font:inherit}
  input:focus{outline:none;border-color:var(--pink2);box-shadow:0 0 0 3px rgba(244,114,182,.18)}
  button.go{width:100%;padding:13px;border:none;border-radius:999px;color:#fff;font:inherit;
    font-size:15px;font-weight:600;cursor:pointer;background:var(--grad);
    box-shadow:0 8px 22px rgba(236,72,153,.35);transition:.18s}
  button.go:hover{filter:brightness(1.06)}
  button.go:disabled{opacity:.55;cursor:not-allowed}
  .status{min-height:44px;margin-top:14px;font-size:13.5px}
  .status.ok{color:var(--ok)} .status.err{color:var(--err)}
  .bar{height:8px;border-radius:99px;background:rgba(255,255,255,.5);overflow:hidden;margin-top:10px;display:none}
  .bar i{display:block;height:100%;width:0%;border-radius:99px;background:var(--grad);transition:width .3s}
  .preview{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:14px}
  .preview img{width:64px;height:64px;object-fit:cover;border-radius:12px;border:1px solid var(--line)}
  .themebar{position:fixed;bottom:14px;right:14px}
  .themebar button{padding:6px 14px;font-size:12px;border-radius:999px;cursor:pointer;
    background:var(--card);color:var(--txt);border:1px solid var(--line)}
  .note{font-size:11px;color:var(--sub);margin-top:14px;opacity:.8}
</style>
</head>
<body>
<div class="card">
  <h1>📤 上传图片到机器人</h1>
  <p class="sub">选好的图会直接进入机器人图片库，任务里就能用</p>

  <div class="drop" id="drop" onclick="document.getElementById('file').click()">
    <div class="ico">🖼️</div>
    <div class="t1">点击选择图片</div>
    <div class="t2">支持多选 · png / jpg / gif / webp · 单张 ≤ 10MB</div>
  </div>
  <input type="file" id="file" accept="image/png,image/jpeg,image/gif,image/webp,image/bmp" multiple>

  <div class="preview" id="preview"></div>

  <div class="row">
    <input type="password" id="token" placeholder="上传 Token（设置里那串）" autocomplete="off">
  </div>

  <button class="go" id="go" onclick="doUpload()">开始上传</button>

  <div class="bar" id="bar"><i></i></div>
  <div class="status" id="status"></div>

  <div class="note">上传会限速：每分钟最多 20 次，请勿刷屏</div>
</div>
<div class="themebar"><button onclick="cycleTheme()" id="theme-btn">◐ 主题</button></div>

<script>
const THEMES = ['sakura','midnight','forest','sunset','ink'];
function applyTheme(id){
  if (id==='sakura') document.documentElement.removeAttribute('data-theme');
  else document.documentElement.setAttribute('data-theme', id);
  localStorage.setItem('qqbot-theme', id);
  const b=document.getElementById('theme-btn');
  const names={sakura:'樱花粉',midnight:'午夜蓝',forest:'森野绿',sunset:'暖阳橙',ink:'墨竹灰'};
  if(b) b.textContent='◐ '+(names[id]||'主题');
}
function cycleTheme(){
  const cur=localStorage.getItem('qqbot-theme')||'sakura';
  applyTheme(THEMES[(THEMES.indexOf(cur)+1)%THEMES.length]);
}
applyTheme(localStorage.getItem('qqbot-theme')||'sakura');
if(localStorage.getItem('qqbot-utoken')) document.getElementById('token').value=localStorage.getItem('qqbot-utoken');

let files=[];
const drop=document.getElementById('drop'), fileEl=document.getElementById('file'),
      preview=document.getElementById('preview'), statusEl=document.getElementById('status'),
      bar=document.getElementById('bar'), go=document.getElementById('go');

fileEl.onchange=()=>setFiles([...fileEl.files]);
['dragover','dragenter'].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.add('over')}));
['dragleave','drop'].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.remove('over')}));
drop.addEventListener('drop',e=>setFiles([...e.dataTransfer.files]));

function setFiles(fs){
  files = fs.filter(f=>f.type.startsWith('image/'));
  if(!files.length){ statusEl.textContent='请选择图片文件'; statusEl.className='status err'; preview.innerHTML=''; return; }
  statusEl.textContent=''; statusEl.className='status';
  preview.innerHTML = files.map(f=>{
    const url=URL.createObjectURL(f);
    return `<img src="${url}">`;
  }).join('');
}

async function doUpload(){
  if(!files.length){ statusEl.textContent='先选图片'; statusEl.className='status err'; return; }
  const token=document.getElementById('token').value.trim();
  localStorage.setItem('qqbot-utoken', token);
  go.disabled=true; bar.style.display='block';
  let ok=0, fail=0;
  for(let i=0;i<files.length;i++){
    bar.firstElementChild.style.width=Math.round((i)/files.length*100)+'%';
    statusEl.textContent=`上传中 ${i+1}/${files.length}…`; statusEl.className='status';
    const b64=await new Promise(res=>{const r=new FileReader();r.onload=()=>res(r.result);r.readAsDataURL(files[i])});
    try{
      const res=await fetch('/remote/upload',{
        method:'POST',
        headers:Object.assign({'Content-Type':'application/json'}, token?{'Authorization':'Bearer '+token}:{}) ,
        body:JSON.stringify({filename:files[i].name, data:b64})
      });
      if(res.ok){ok++;}else{fail++; }
    }catch(e){fail++;}
  }
  bar.firstElementChild.style.width='100%';
  go.disabled=false;
  if(fail===0){
    statusEl.textContent=`✅ 全部成功：${ok} 张已进图片库`;
    statusEl.className='status ok';
    preview.innerHTML=''; files=[]; fileEl.value='';
    setTimeout(()=>{bar.style.display='none';bar.firstElementChild.style.width='0%';},800);
  }else{
    statusEl.textContent=`成功 ${ok} 张，失败 ${fail} 张（检查 Token 或文件大小）`;
    statusEl.className='status err';
  }
}
</script>
</body>
</html>
