<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>图片上传 · QQ 机器人</title>
<style>
  :root{
    --bg:#0a0f1e; --bg2:#0d1526;
    --card:#111b2e; --card2:#16213a;
    --line:rgba(99,169,255,.18);
    --txt:#dbeafe; --sub:#7b8bab;
    --blue:#38bdf8; --indigo:#818cf8;
    --grad:linear-gradient(135deg,#38bdf8,#818cf8);
    --ok:#34d399; --warn:#fbbf24; --err:#f87171;
    --in:#0d1526;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{
    margin:0;min-height:100vh;padding:22px 14px 40px;color:var(--txt);
    font:15px/1.65 -apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    background:radial-gradient(760px 420px at 12% -8%, #12304f 0%, transparent 58%),
               radial-gradient(680px 380px at 92% 4%, #241a52 0%, transparent 55%),
               linear-gradient(165deg,#0a0f1e,#0d1526 60%,#090d18);
    background-attachment:fixed;
    display:flex;flex-direction:column;align-items:center;
  }
  .card{
    background:var(--card);border:1px solid var(--line);border-radius:18px;
    padding:24px 20px;width:min(430px,100%);
    box-shadow:0 16px 44px rgba(0,0,0,.45);
    margin-bottom:14px;
  }
  h1{
    font-size:18px;margin:0 0 5px;font-weight:800;letter-spacing:.2px;
    display:flex;align-items:center;gap:9px;color:var(--txt);
  }
  h1 .ic{width:23px;height:23px;flex:none;display:grid;place-items:center;color:var(--blue)}
  h1 .ic svg{width:100%;height:100%}
  .lbl{color:var(--sub);font-size:13px;margin:0 0 20px}

  .steps{display:flex;gap:8px;margin-bottom:18px}
  .steps button{
    flex:1;margin:0;padding:11px 4px;border-radius:11px;font-size:13px;font-weight:600;
    background:var(--card2) !important;border:1px solid var(--line) !important;
    box-shadow:none !important;color:var(--sub) !important;
  }
  .steps button.on{
    background:rgba(56,189,248,.12) !important;color:var(--blue) !important;
    border-color:rgba(56,189,248,.42) !important;
  }

  input[type=text],input[type=password]{
    width:100%;background:var(--in);color:var(--txt);
    border:1px solid var(--line);border-radius:11px;
    padding:13px 15px;font:inherit;font-size:16px;margin-bottom:12px;
  }
  input:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(56,189,248,.14)}
  input::placeholder{color:#5b6b8a}

  button{
    width:100%;padding:13px 16px;border:none;border-radius:11px;color:#fff;
    font:inherit;font-size:15px;font-weight:600;cursor:pointer;
    background:var(--grad);box-shadow:0 8px 20px rgba(56,189,248,.2);
    transition:filter .15s,transform .12s;margin-bottom:10px;
  }
  button:hover{filter:brightness(1.07)}
  button:active{transform:scale(.985)}
  button:disabled{opacity:.5;cursor:not-allowed;box-shadow:none}
  button.ghost{
    background:transparent;border:1px solid var(--line);color:var(--sub);
    box-shadow:none;font-weight:500;
  }
  button.ghost:hover{border-color:var(--blue);color:var(--blue)}
  /* 行内小按钮：必须覆盖 width:100% */
  button.inline{
    width:auto !important;flex:none;margin:0;padding:5px 11px;
    font-size:12px;font-weight:500;border-radius:8px;box-shadow:none;
    background:var(--card2);border:1px solid var(--line);color:var(--sub);
  }
  button.inline:hover{border-color:var(--blue);color:var(--blue);filter:none}
  button.inline.solid{background:var(--grad);border:none;color:#fff}

  .msg{min-height:22px;margin:8px 0 0;font-size:13.5px;line-height:1.6}
  .msg.ok{color:var(--ok)}
  .msg.err{color:var(--err);font-weight:500}
  .hidden{display:none !important}

  .me{
    display:flex;align-items:center;gap:9px;flex-wrap:wrap;
    padding:11px 13px;margin-bottom:16px;border-radius:11px;
    background:var(--card2);border:1px solid var(--line);font-size:13.5px;
  }
  .me .av{width:25px;height:25px;flex:none;display:grid;place-items:center;color:var(--blue)}
  .me .av svg{width:100%;height:100%}
  .me b{color:var(--txt);font-weight:700}
  .me .no{color:var(--sub);font-size:12px;margin-left:4px}
  .me .sp{flex:1;min-width:4px}

  .drop{
    border:2px dashed var(--line);border-radius:13px;padding:26px 14px;
    text-align:center;cursor:pointer;transition:.18s;background:rgba(56,189,248,.03);
    margin-bottom:14px;
  }
  .drop:hover,.drop.over{border-color:var(--blue);background:rgba(56,189,248,.08)}
  .drop .ic{width:36px;height:36px;margin:0 auto 8px;display:grid;place-items:center;color:var(--blue);opacity:.85}
  .drop .ic svg{width:100%;height:100%}
  .drop .t1{font-size:14.5px;font-weight:700;color:var(--txt)}
  .drop .t2{font-size:12px;color:var(--sub);margin-top:3px}
  input[type=file]{display:none}
  .preview{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:12px}
  .preview img{width:62px;height:62px;object-fit:cover;border-radius:10px;border:1px solid var(--line)}
  .bar{height:6px;border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden;display:none;margin:4px 0 10px}
  .bar i{display:block;height:100%;width:0;border-radius:99px;background:var(--grad);transition:width .25s}

  .sec{margin-top:20px;padding-top:16px;border-top:1px solid var(--line)}
  .sec:first-child{margin-top:0;padding-top:0;border-top:none}
  .sec-h{
    display:flex;align-items:center;gap:8px;margin:0 0 10px;
    font-size:13px;font-weight:700;color:var(--sub);
  }
  .sec-h .cnt{
    font-size:11px;font-weight:600;padding:1px 7px;border-radius:99px;
    background:rgba(56,189,248,.14);color:var(--blue);
  }
  .sec-h .sp{flex:1}

  .row{
    display:flex;align-items:center;gap:10px;padding:9px 0;
    border-bottom:1px solid var(--line);font-size:12.5px;
  }
  .row:last-child{border-bottom:none}
  .row img{
    width:44px;height:44px;flex:none;object-fit:cover;border-radius:9px;
    border:1px solid var(--line);cursor:zoom-in;
  }
  .row .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--txt)}
  .row .nm .t{display:block;font-size:12px;color:var(--sub);margin-top:1px}
  .tag{font-size:11px;padding:3px 9px;border-radius:99px;white-space:nowrap;font-weight:600}
  .tag.pending{background:rgba(251,191,36,.14);color:var(--warn)}
  .tag.approved{background:rgba(52,211,153,.14);color:var(--ok)}
  .tag.rejected{background:rgba(248,113,113,.14);color:var(--err)}
  .empty{text-align:center;color:var(--sub);font-size:12.5px;padding:18px 0}

  .rev{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
  .rev:last-child{border-bottom:none}
  .rev img{width:54px;height:54px;flex:none;object-fit:cover;border-radius:10px;
    border:1px solid var(--line);cursor:zoom-in}
  .rev .info{flex:1;min-width:0;font-size:12.5px}
  .rev .info .n{display:block;color:var(--txt);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .rev .info .u{display:block;color:var(--sub);font-size:11.5px;margin-top:2px}
  .rev .ops{display:flex;gap:6px;flex:none}
  .rev .ops button.inline.ok{background:rgba(52,211,153,.16);border-color:rgba(52,211,153,.5);color:var(--ok)}
  .rev .ops button.inline.no{background:rgba(248,113,113,.13);border-color:rgba(248,113,113,.45);color:var(--err)}

  .note{font-size:11.5px;color:var(--sub);text-align:center;margin-top:14px;line-height:1.7}

  .lightbox{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:99;
    visibility:hidden;opacity:0;display:grid;place-items:center;cursor:zoom-out}
  .lightbox.show{visibility:visible;opacity:1}
  .lightbox img{max-width:94vw;max-height:88vh;border-radius:12px;box-shadow:0 20px 70px rgba(0,0,0,.8)}
  .lightbox .x{position:absolute;top:16px;right:16px;width:auto;padding:7px 16px;
    font-size:13px;background:rgba(255,255,255,.12);border:none;color:#fff;box-shadow:none}

  @media (max-width:420px){
    body{padding:12px 10px 28px}
    .card{padding:20px 16px;border-radius:15px}
    h1{font-size:17px}
    .rev img{width:46px;height:46px}
    .row img{width:40px;height:40px}
  }
</style>
</head>
<body>

<!-- 登录 / 注册 -->
<div class="card" id="loginCard">
  <h1>
    <span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16.5V4.5"/><path d="M7.5 9L12 4.5 16.5 9"/><path d="M4.5 15v3.5a2 2 0 0 0 2 2h11a2 2 0 0 0 2-2V15"/></svg></span>
    图片上传中心
  </h1>
  <p class="lbl">登录上传，或使用 QQ 邮箱注册新账号</p>

  <div class="steps">
    <button id="tab-login" class="on" onclick="switchTab('login')">① 登录</button>
    <button id="tab-reg" onclick="switchTab('reg')">② 注册账号</button>
  </div>

  <div id="formLogin">
    <input type="text" id="u" placeholder="账号或数字 ID" autocomplete="username">
    <input type="password" id="p" placeholder="密码" autocomplete="current-password">
    <button id="loginBtn" onclick="doLogin()">登录</button>
    <div class="msg" id="loginMsg"></div>
  </div>

  <div id="formReg" class="hidden">
    <input type="text" id="r-mail" placeholder="QQ 邮箱（如 12345@qq.com）" autocomplete="off">
    <div style="display:flex;gap:8px;margin-bottom:12px">
      <input type="text" id="r-code" placeholder="邮箱验证码" maxlength="6" style="margin-bottom:0">
      <button class="inline solid" id="codeBtn" onclick="sendCode()" style="padding:0 14px;font-size:13px;white-space:nowrap">发送验证码</button>
    </div>
    <input type="text" id="r-user" placeholder="账号名（2-20 位，字母/数字/中文）">
    <input type="password" id="r-pass" placeholder="密码（至少 4 位）">
    <button onclick="doApply()">提交注册</button>
    <div class="msg" id="regMsg"></div>
  </div>

  <div class="note">一个邮箱只能注册一个账号，验证通过后立即生效。</div>
</div>

<!-- 上传 -->
<div class="card hidden" id="uploadCard">
  <h1>
    <span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16.5V4.5"/><path d="M7.5 9L12 4.5 16.5 9"/><path d="M4.5 15v3.5a2 2 0 0 0 2 2h11a2 2 0 0 0 2-2V15"/></svg></span>
    上传图片
  </h1>
  <p class="lbl">提交后等待管理员审核，通过后可被机器人使用</p>

  <div class="me">
    <span class="av"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="8" r="3.4"/><path d="M5.5 19.5c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6"/></svg></span>
    <span><b id="whoami">—</b><span class="no" id="whono"></span></span>
    <span class="sp"></span>
    <button class="inline" onclick="doChangePw()">改密码</button>
    <button class="inline" onclick="doLogout()">退出</button>
  </div>

  <div class="drop" id="drop" onclick="document.getElementById('file').click()">
    <div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2.2"/><circle cx="8.5" cy="9.5" r="1.6"/><path d="M3.6 17.4l4.6-4.4 3.3 3.2 2.8-2.5 5.8 5.5"/></svg></div>
    <div class="t1">点击选择图片</div>
    <div class="t2">支持多选 · png / jpg / gif / webp · 单张 ≤ 10MB</div>
  </div>
  <input type="file" id="file" accept="image/png,image/jpeg,image/gif,image/webp,image/bmp" multiple>
  <div class="preview" id="preview"></div>
  <button id="go" onclick="doUpload()">提交审核</button>
  <div class="bar" id="bar"><i></i></div>
  <div class="msg" id="upMsg"></div>

  <div class="sec hidden" id="adminEntry">
    <button class="ghost" onclick="openAdminPanel()" style="margin:0">
      🛡️ 打开管理员审批面板
    </button>
  </div>

  <div class="sec">
    <div class="sec-h">
      我的上传 <span class="cnt" id="mineCount">0</span>
      <span class="sp"></span>
      <button class="inline" onclick="loadMine()">刷新</button>
    </div>
    <div id="mineList"></div>
  </div>

  <div class="sec">
    <div class="sec-h">账号安全</div>
    <button class="ghost" onclick="doChangePw()" style="margin:0">🔑 修改登录密码</button>
  </div>

  <div class="note">图片上传后需管理员审核，请耐心等待</div>
</div>

<!-- 管理员审批面板 -->
<div class="card hidden" id="adminCard">
  <h1>
    <span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.5l7 3v5.5c0 4-3 6.7-7 7.5-4-.8-7-3.5-7-7.5V6.5z"/><path d="M8.8 12l2.2 2.2 4.2-4.4"/></svg></span>
    管理员审批
  </h1>
  <p class="lbl">审核图片 · 批准注册申请</p>

  <div class="me">
    <span class="av"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 3.5l7 3v5.5c0 4-3 6.7-7 7.5-4-.8-7-3.5-7-7.5V6.5z"/></svg></span>
    <span><b>管理员模式</b><span class="no" id="adminMode"></span></span>
    <span class="sp"></span>
    <button class="inline" onclick="closeAdminPanel()">返回</button>
  </div>

  <div id="pwWrap" class="hidden">
    <input type="password" id="apw" placeholder="管理密码" oninput="pwChanged()">
    <button onclick="loadAdmin()">进入</button>
  </div>
  <div class="msg" id="adminMsg"></div>

  <div class="sec" id="adminBody" style="display:none">
    <div class="sec-h">
      待审核图片 <span class="cnt" id="revCount">0</span>
      <span class="sp"></span>
      <button class="inline" onclick="loadAdmin()">刷新</button>
    </div>
    <div id="revList"></div>
  </div>

  <div class="sec" id="adminBody2" style="display:none">
    <div class="sec-h">
      待批注册申请 <span class="cnt" id="apCount">0</span>
      <span class="sp"></span>
      <button class="inline" onclick="loadAdmin()">刷新</button>
    </div>
    <div id="apList"></div>
  </div>
</div>

<div class="lightbox" id="lightbox" onclick="closeLightbox()">
  <button class="x" onclick="event.stopPropagation();closeLightbox()">✕ 关闭</button>
  <img id="lightboxImg" src="" alt="" onclick="event.stopPropagation()">
</div>

<script>
const $ = s => document.querySelector(s);
const PW_KEY = 'qqbot-admin-pw';
const TK_KEY = 'qqbot-upload-token';
const AD_KEY = 'qqbot-is-admin';

const H = () => {
  const t = localStorage.getItem(TK_KEY) || '';
  return t ? {'X-Upload-Session': t} : {};
};

function msg(sel, text, isErr) {
  const el = $(sel);
  if (!el) return;
  el.textContent = text || '';
  el.className = 'msg' + (text ? (isErr ? ' err' : ' ok') : '');
}

async function post(path, body, headers) {
  const h = Object.assign({'Content-Type': 'application/json'}, headers || {});
  const res = await fetch(path, {
    method: 'POST', credentials: 'same-origin', headers: h, body: JSON.stringify(body)
  });
  let d = {};
  try { d = await res.json(); } catch (e) {}
  if (!res.ok) throw new Error(d.detail || ('请求失败 ' + res.status));
  return d;
}

function switchTab(which) {
  const isLogin = which === 'login';
  $('#formLogin').classList.toggle('hidden', !isLogin);
  $('#formReg').classList.toggle('hidden', isLogin);
  $('#tab-login').classList.toggle('on', isLogin);
  $('#tab-reg').classList.toggle('on', !isLogin);
}

async function doLogin() {
  const u = $('#u').value.trim(), p = $('#p').value;
  if (!u || !p) return msg('#loginMsg', '请填写账号和密码', true);
  $('#loginBtn').disabled = true;
  msg('#loginMsg', '');
  try {
    const d = await post('/remote/login', {username: u, password: p});
    localStorage.setItem(TK_KEY, d.token);
    localStorage.setItem(AD_KEY, d.is_admin ? '1' : '');
    enterUpload(d.username, d.uid_number, d.is_admin);
  } catch (e) {
    msg('#loginMsg', e.message, true);
  }
  $('#loginBtn').disabled = false;
}

function enterUpload(username, uidNumber, isAdmin) {
  $('#whoami').textContent = username;
  $('#whono').textContent = uidNumber ? '#' + uidNumber : '';
  const admin = !!isAdmin || localStorage.getItem(AD_KEY) === '1';
  $('#adminEntry').classList.toggle('hidden', !admin);
  $('#loginCard').classList.add('hidden');
  $('#uploadCard').classList.remove('hidden');
  $('#adminCard').classList.add('hidden');
  loadMine();
}

let codeTimer = null;
async function sendCode() {
  const mail = $('#r-mail').value.trim();
  if (!mail) return msg('#regMsg', '请先填写 QQ 邮箱', true);
  const btn = $('#codeBtn');
  btn.disabled = true;
  msg('#regMsg', '');
  try {
    await post('/remote/apply/send-code', {mail});
    msg('#regMsg', '验证码已发送，10 分钟内有效');
    let n = 60;
    codeTimer = setInterval(() => {
      btn.textContent = n-- + 's';
      if (n < 0) {
        clearInterval(codeTimer);
        btn.disabled = false;
        btn.textContent = '发送验证码';
      }
    }, 1000);
  } catch (e) {
    msg('#regMsg', e.message, true);
    btn.disabled = false;
  }
}

async function doApply() {
  const mail = $('#r-mail').value.trim();
  const code = $('#r-code').value.trim();
  const username = $('#r-user').value.trim();
  const password = $('#r-pass').value;
  if (!mail || !code || !username || !password) return msg('#regMsg', '请填写完整', true);
  try {
    const d = await post('/remote/apply', {mail, code, username, password});
    msg('#regMsg', '✅ 注册成功！' + (d.uid_number ? '数字 ID #' + d.uid_number + '，' : '') + '请登录');
    switchTab('login');
    $('#u').value = username;
    $('#loginMsg').textContent = '账号已就绪，输入密码登录即可';
    $('#loginMsg').className = 'msg ok';
  } catch (e) {
    msg('#regMsg', e.message, true);
  }
}

let files = [];
const drop = $('#drop'), fileEl = $('#file');
fileEl.onchange = () => setFiles([].slice.call(fileEl.files));
['dragover','dragenter'].forEach(ev =>
  drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add('over'); }));
['dragleave','drop'].forEach(ev =>
  drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove('over'); }));
drop.addEventListener('drop', e => setFiles([].slice.call(e.dataTransfer.files)));

function setFiles(fs) {
  files = fs.filter(f => f.type.startsWith('image/'));
  $('#preview').innerHTML = files.map(f => '<img src="' + URL.createObjectURL(f) + '">').join('');
  msg('#upMsg', files.length ? '已选 ' + files.length + ' 张' : '');
}

async function doUpload() {
  if (!files.length) return msg('#upMsg', '请先选择图片', true);
  $('#go').disabled = true;
  $('#bar').style.display = 'block';
  let ok = 0, fail = 0, lastErr = '';
  for (let i = 0; i < files.length; i++) {
    $('#bar').firstElementChild.style.width = Math.round(i / files.length * 100) + '%';
    msg('#upMsg', '提交中 ' + (i + 1) + ' / ' + files.length);
    const b64 = await new Promise(r => {
      const fr = new FileReader();
      fr.onload = () => r(fr.result);
      fr.readAsDataURL(files[i]);
    });
    try {
      await post('/remote/upload', {filename: files[i].name, data: b64}, H());
      ok++;
    } catch (e) {
      if (/登录|会话/.test(e.message)) {
        fail += files.length - i;
        lastErr = '登录已过期，请重新登录';
        break;
      }
      fail++;
      lastErr = e.message;
    }
  }
  $('#bar').firstElementChild.style.width = '100%';
  $('#go').disabled = false;
  if (!fail) {
    msg('#upMsg', '✅ ' + ok + ' 张已提交，等待管理员审核');
    files = [];
    fileEl.value = '';
    $('#preview').innerHTML = '';
    setTimeout(() => {
      $('#bar').style.display = 'none';
      $('#bar').firstElementChild.style.width = '0%';
    }, 800);
  } else {
    msg('#upMsg', '成功 ' + ok + '，失败 ' + fail + (lastErr ? '：' + lastErr : ''), true);
  }
  loadMine();
}

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}

async function loadMine() {
  try {
    const r = await fetch('/remote/mine', {credentials: 'same-origin', headers: H()});
    if (r.status === 401) {
      localStorage.removeItem(TK_KEY);
      location.reload();
      return;
    }
    const d = await r.json();
    const list = d.images || [];
    $('#mineCount').textContent = list.length;
    const tagText = {pending: '待审核', approved: '已通过', rejected: '未通过'};
    $('#mineList').innerHTML = list.length ? list.map(function (i) {
      return '<div class="row">' +
        '<img src="/remote/thumb/' + i.id + '" onclick="openLightbox(this.src.replace(\'/thumb\',\'/file\'))" onerror="this.style.display=\'none\'">' +
        '<span class="nm">' + esc(i.original) +
        '<span class="t">' + esc((i.created_at || '').slice(5, 16)) + '</span></span>' +
        '<span class="tag ' + (i.status || 'approved') + '" title="' + esc(i.review_note || '') + '">' +
        (tagText[i.status] || '已通过') + '</span>' +
        '</div>';
    }).join('') : '<div class="empty">还没有上传记录</div>';
  } catch (e) {}
}

async function doChangePw() {
  const oldPw = prompt('请输入当前密码：') || '';
  if (!oldPw) return;
  const newPw = prompt('设置新密码（至少 4 位）：') || '';
  if (!newPw || newPw.length < 4) return alert('新密码至少 4 位');
  if (newPw === oldPw) return alert('新密码不能与原密码相同');
  if ((prompt('再输入一次新密码：') || '') !== newPw) return alert('两次输入不一致');
  try {
    await post('/remote/change-password', {old_password: oldPw, new_password: newPw}, H());
    localStorage.removeItem(TK_KEY);
    alert('密码已修改，请用新密码重新登录');
    location.reload();
  } catch (e) { alert(e.message); }
}

async function doLogout() {
  await fetch('/remote/logout', {method: 'POST', credentials: 'same-origin'}).catch(function () {});
  localStorage.removeItem(TK_KEY);
  localStorage.removeItem(AD_KEY);
  location.reload();
}

let adminPw = '';
function openAdminPanel() {
  adminPw = localStorage.getItem(PW_KEY) || '';
  $('#adminMode').textContent = localStorage.getItem(AD_KEY) === '1' ? '管理员账号已登录' : '';
  const hasSession = !!localStorage.getItem(TK_KEY) && localStorage.getItem(AD_KEY) === '1';
  if (hasSession) {
    $('#pwWrap').classList.add('hidden');
  } else {
    $('#pwWrap').classList.remove('hidden');
    $('#apw').value = adminPw;
  }
  $('#loginCard').classList.add('hidden');
  $('#uploadCard').classList.add('hidden');
  $('#adminCard').classList.remove('hidden');
  loadAdmin();
}
function closeAdminPanel() {
  $('#adminCard').classList.add('hidden');
  $('#loginCard').classList.toggle('hidden', !!localStorage.getItem(TK_KEY));
  $('#uploadCard').classList.toggle('hidden', !localStorage.getItem(TK_KEY));
}
function pwChanged() {
  adminPw = $('#apw').value.trim();
  if (adminPw) localStorage.setItem(PW_KEY, adminPw);
}

async function loadAdmin() {
  msg('#adminMsg', '');
  let images = [], applies = [];
  try {
    const d1 = await post('/remote/admin-pending', {admin_password: adminPw}, H());
    images = d1.images || [];
    const d2 = await post('/remote/admin-applies', {admin_password: adminPw}, H());
    applies = d2.applies || [];
  } catch (e) {
    msg('#adminMsg', e.message, true);
    $('#adminBody').style.display = 'none';
    $('#adminBody2').style.display = 'none';
    if (/权限/.test(e.message)) $('#pwWrap').classList.remove('hidden');
    return;
  }
  $('#adminBody').style.display = '';
  $('#adminBody2').style.display = '';
  $('#revCount').textContent = images.length;
  $('#revList').innerHTML = images.length ? images.map(function (i) {
    return '<div class="rev">' +
      '<img src="/remote/thumb/' + i.id + '" onclick="openLightbox(this.src.replace(\'/thumb\',\'/file\'))" onerror="this.style.display=\'none\'">' +
      '<span class="info">' +
      '<span class="n">' + esc(i.original) + '</span>' +
      '<span class="u">@' + esc(i.uploader) + ' · ' + esc((i.created_at || '').slice(5, 16)) + '</span>' +
      '</span>' +
      '<span class="ops">' +
      '<button class="inline ok" onclick="reviewOne(' + i.id + ',\'approve\')">通过</button>' +
      '<button class="inline no" onclick="reviewOne(' + i.id + ',\'reject\')">驳回</button>' +
      '</span></div>';
  }).join('') : '<div class="empty">没有待审核的图片</div>';

  $('#apCount').textContent = applies.length;
  $('#apList').innerHTML = applies.length ? applies.map(function (a) {
    return '<div class="rev">' +
      '<span class="info"><span class="n">' + esc(a.username) + '</span>' +
      '<span class="u">' + esc(a.mail) + '</span></span>' +
      '<span class="ops">' +
      '<button class="inline ok" onclick="applyOne(' + a.id + ',\'approve\')">批准</button>' +
      '<button class="inline no" onclick="applyOne(' + a.id + ',\'reject\')">驳回</button>' +
      '</span></div>';
  }).join('') : '<div class="empty">没有待批的注册申请</div>';
}

async function reviewOne(id, action) {
  try {
    await post('/remote/admin-review', {admin_password: adminPw, ids: [id], action}, H());
    loadAdmin();
  } catch (e) { msg('#adminMsg', e.message, true); }
}
async function applyOne(aid, action) {
  try {
    await post(action === 'approve' ? '/remote/admin-apply-approve' : '/remote/admin-apply-reject',
               {admin_password: adminPw, aid}, H());
    loadAdmin();
  } catch (e) { msg('#adminMsg', e.message, true); }
}

function openLightbox(src) {
  $('#lightboxImg').src = src;
  $('#lightbox').classList.add('show');
}
function closeLightbox() {
  $('#lightbox').classList.remove('show');
  $('#lightboxImg').src = '';
}
document.addEventListener('keydown', function (e) {
  if (e.key === 'Escape') closeLightbox();
});

(function boot() {
  const lb = $('#lightbox');
  if (lb) lb.classList.remove('show');
  const t = localStorage.getItem(TK_KEY);
  if (!t) return;
  fetch('/remote/me', {credentials: 'same-origin', headers: {'X-Upload-Session': t}})
    .then(function (r) { return r.ok ? r.json() : null; })
    .then(function (me) {
      if (me && me.ok) {
        localStorage.setItem(AD_KEY, me.is_admin ? '1' : '');
        enterUpload(me.username, me.uid_number, me.is_admin);
      } else {
        localStorage.removeItem(TK_KEY);
      }
    })
    .catch(function () { localStorage.removeItem(TK_KEY); });
})();
</script>
