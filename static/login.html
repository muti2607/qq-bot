<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>登录 · QQ 定时发布机器人</title>
<style>
  :root{
    --bg1:#ffe3f1; --bg2:#e9e4ff; --bg3:#dbeafe;
    --glow1:#ffd6ea; --glow2:#dcd6ff; --glow3:#cfe6ff;
    --card:rgba(255,255,255,.8); --txt:#3f3350; --sub:#9b8fae;
    --line:#f3d3e3; --pink:#ec4899; --pink2:#f472b6;
    --grad:linear-gradient(92deg,#ec4899,#a855f7);
    --input-bg:rgba(255,255,255,.85);
  }
  [data-theme="tech"]{
    --bg1:#0a0f1e; --bg2:#0d1526; --bg3:#090d18;
    --glow1:#0e2a4a; --glow2:#1a1440; --glow3:#0a2338;
    --card:rgba(15,23,42,.8); --txt:#dbeafe; --sub:#64748b;
    --line:#1e3a5f; --pink:#38bdf8; --pink2:#22d3ee;
    --grad:linear-gradient(92deg,#38bdf8,#818cf8);
    --input-bg:rgba(8,13,26,.85);
  }
  [data-theme="lava"]{
    --bg1:#12060a; --bg2:#1a0a10; --bg3:#0d0508;
    --glow1:#3d0f1a; --glow2:#2b0a20; --glow3:#33101a;
    --card:rgba(28,10,16,.85); --txt:#fee2e2; --sub:#c08a8a;
    --line:#571e2b; --pink:#f87171; --pink2:#fca5a5;
    --grad:linear-gradient(92deg,#f87171,#fb923c);
    --input-bg:rgba(16,6,10,.85);
  }
  [data-theme="cryo"]{
    --bg1:#0b1626; --bg2:#0e1d33; --bg3:#091322;
    --glow1:#123a5c; --glow2:#0f2c50; --glow3:#0c3050;
    --card:rgba(13,27,46,.85); --txt:#e0f2fe; --sub:#7dd3fc99;
    --line:#1e4a6e; --pink:#7dd3fc; --pink2:#bae6fd;
    --grad:linear-gradient(92deg,#7dd3fc,#818cf8);
    --input-bg:rgba(9,19,34,.85);
  }
  [data-theme="quantum"]{
    --bg1:#12081f; --bg2:#1a0b2e; --bg3:#0d0618;
    --glow1:#3b1160; --glow2:#251047; --glow3:#33104d;
    --card:rgba(26,12,46,.85); --txt:#f3e8ff; --sub:#a78bc0;
    --line:#4a2069; --pink:#d946ef; --pink2:#f0abfc;
    --grad:linear-gradient(92deg,#d946ef,#8b5cf6);
    --input-bg:rgba(16,8,30,.85);
  }
  [data-theme="matrix"]{
    --bg1:#030a05; --bg2:#051108; --bg3:#020804;
    --glow1:#0a2f16; --glow2:#0d2412; --glow3:#08331c;
    --card:rgba(6,20,10,.85); --txt:#bbf7d0; --sub:#4ade8099;
    --line:#14532d; --pink:#4ade80; --pink2:#86efac;
    --grad:linear-gradient(92deg,#4ade80,#22c55e);
    --input-bg:rgba(2,8,4,.85);
  }
  [data-theme="midnight"]{
    --bg1:#131a2b; --bg2:#181430; --bg3:#0f1a24;
    --glow1:#233a63; --glow2:#34265e; --glow3:#16304a;
    --card:rgba(30,38,58,.8); --txt:#e6e9f5; --sub:#8b93ad;
    --line:#39415c; --pink:#818cf8; --pink2:#a78bfa;
    --grad:linear-gradient(92deg,#818cf8,#c084fc);
    --input-bg:rgba(24,31,48,.85);
  }
  [data-theme="forest"]{
    --bg1:#e3f7ec; --bg2:#d9f0e3; --bg3:#e8f5d9;
    --glow1:#c7f0d8; --glow2:#d5eec0; --glow3:#bfe9e0;
    --card:rgba(255,255,255,.82); --txt:#264038; --sub:#7a9b8e;
    --line:#c9e8d8; --pink:#10b981; --pink2:#34d399;
    --grad:linear-gradient(92deg,#10b981,#0d9488);
    --input-bg:rgba(255,255,255,.88);
  }
  [data-theme="sunset"]{
    --bg1:#fff1e0; --bg2:#ffe4e0; --bg3:#fde8f0;
    --glow1:#ffe0b2; --glow2:#ffd0c0; --glow3:#ffd6e8;
    --card:rgba(255,255,255,.84); --txt:#4a3527; --sub:#a8896f;
    --line:#fbd9c4; --pink:#f97316; --pink2:#fb923c;
    --grad:linear-gradient(92deg,#f97316,#ef4444);
    --input-bg:rgba(255,255,255,.9);
  }
  [data-theme="ink"]{
    --bg1:#f4f4f2; --bg2:#eceae6; --bg3:#e6e8e4;
    --glow1:#e8e6e1; --glow2:#dfe2dc; --glow3:#e4e4e6;
    --card:rgba(255,255,255,.88); --txt:#2d3236; --sub:#8a8d86;
    --line:#d8d6d0; --pink:#4b5563; --pink2:#6b7280;
    --grad:linear-gradient(92deg,#374151,#1f2937);
    --input-bg:rgba(255,255,255,.9);
  }
  body{margin:0;min-height:100vh;display:grid;place-items:center;color:var(--txt);
       font:14px/1.6 -apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
       background:
         radial-gradient(900px 500px at 10% -10%, var(--glow1) 0%, transparent 55%),
         radial-gradient(800px 400px at 90% 0%, var(--glow2) 0%, transparent 50%),
         radial-gradient(700px 500px at 50% 110%, var(--glow3) 0%, transparent 55%),
         linear-gradient(160deg, var(--bg1), var(--bg2) 55%, var(--bg3));
       background-attachment:fixed;transition:background .35s ease,color .35s ease}
  form{background:var(--card);backdrop-filter:blur(12px);
       border:1px solid rgba(255,255,255,.5);border-radius:22px;padding:30px 26px;width:min(360px,90vw);
       box-shadow:0 18px 50px rgba(236,72,153,.18)}
  h1{font-size:18px;margin:0 0 4px;font-weight:800;
     background:var(--grad);
     -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
  p{color:var(--sub);margin:0 0 18px;font-size:13px}
  input{width:100%;box-sizing:border-box;background:var(--input-bg);color:var(--txt);
        border:1px solid var(--line);border-radius:12px;padding:10px 12px;font:inherit}
  input:focus{outline:none;border-color:var(--pink2);box-shadow:0 0 0 3px rgba(244,114,182,.18)}
  button{margin-top:14px;width:100%;padding:10px;border:none;border-radius:999px;color:#fff;font:inherit;cursor:pointer;
         background:var(--grad);box-shadow:0 6px 18px rgba(236,72,153,.35);transition:.18s}
  button:hover{filter:brightness(1.06)}
  button:disabled{opacity:.6}
  .err{color:#e11d48;font-size:13px;min-height:18px;margin-top:8px}
  .themebar{position:fixed;bottom:18px;right:18px;display:flex;gap:8px}
  .themebar button{width:auto;margin:0;padding:6px 14px;font-size:12px;
    background:var(--card);color:var(--txt);border:1px solid var(--line);box-shadow:none}
</style>
</head>
<body>
<form onsubmit="login(event)">
  <h1>QQ 定时发布机器人</h1>
  <p>请输入管理密码</p>
  <input id="pwd" type="password" autocomplete="current-password" autofocus>
  <button id="btn" type="submit">登录</button>
  <div id="err" class="err"></div>
</form>
<div class="themebar"><button onclick="cycleTheme()" id="theme-btn">◐ 主题</button></div>
<script>
const THEMES = [
  {id: 'tech', name: '深空科技'},
  {id: 'quantum', name: '量子霓虹'},
  {id: 'matrix', name: '矩阵终端'},
  {id: 'lava', name: '熔岩警报'},
  {id: 'cryo', name: '冰晶全息'},
  {id: 'sakura', name: '樱花粉'}, {id: 'midnight', name: '午夜蓝'},
  {id: 'forest', name: '森野绿'}, {id: 'sunset', name: '暖阳橙'},
  {id: 'ink', name: '墨竹灰'},
];
function applyTheme(id) {
  const t = THEMES.some(x => x.id === id) ? id : 'sakura';
  if (t === 'sakura') document.documentElement.removeAttribute('data-theme');
  else document.documentElement.setAttribute('data-theme', t);
  localStorage.setItem('qqbot-theme', t);
  const b = document.getElementById('theme-btn');
  if (b) b.textContent = '◐ ' + THEMES.find(x => x.id === t).name;
}
function cycleTheme() {
  const cur = localStorage.getItem('qqbot-theme') || 'sakura';
  const i = THEMES.findIndex(x => x.id === cur);
  applyTheme(THEMES[(i + 1) % THEMES.length].id);
}
applyTheme(localStorage.getItem('qqbot-theme') || 'sakura');

async function login(e) {
  e.preventDefault();
  const btn = document.getElementById('btn'), err = document.getElementById('err');
  btn.disabled = true; err.textContent = '';
  try {
    const res = await fetch('/api/login', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({password: document.getElementById('pwd').value}),
    });
    if (res.ok) { location.href = '/'; return; }
    const d = await res.json().catch(() => ({}));
    err.textContent = d.detail || '登录失败';
  } catch (x) { err.textContent = '网络错误：' + x.message; }
  btn.disabled = false;
}
</script>
</body>
</html>
