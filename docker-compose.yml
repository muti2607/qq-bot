services:
  # NapCat：QQ 协议端（扫码登录后即在线），对外只开 WebUI 3000
  napcat:
    image: mlikiowa/napcat-docker:latest
    container_name: napcat
    restart: unless-stopped
    environment:
      - NAPCAT_UID=${NAPCAT_UID:-1000}
      - NAPCAT_GID=${NAPCAT_GID:-1000}
      - MODE=ws
    # 6099 WebUI 已停用（QQ 掉线靠 autoLogin 自动恢复，无需 WebUI）；3001 仅容器内网使用
    volumes:
      - ./napcat/config:/app/napcat/config
      - ./napcat/qq:/app/.config/QQ
    mem_limit: 900m

  # 机器人：管理后台 + 定时器
  bot:
    build: .
    container_name: qq-daily-bot
    restart: unless-stopped
    depends_on:
      - napcat
    environment:
      - PORT=8080
      - TZ=Asia/Shanghai
      - ONEBOT_HTTP=http://napcat:3001
    volumes:
      - ./data:/app/data
    ports:
      # 管理后台：可暴露公网（务必先设置管理密码，否则任何人都能操作）
      - "8080:8080"
      # 远程上传专用端口：只含 /remote/* 接口，可安全暴露公网（Token+限流保护）
      - "8001:8001"
    mem_limit: 400m
